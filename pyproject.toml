[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-atp"
version = "0.1.0"
description = "A durable, race-safe metagraph memory system for long-horizon automated theorem proving"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mathematics-ai-atp",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/commit_gate/tests", "src/shared/tests", "src/mathproof/tests"]

[tool.uv.sources]
mathematics-ai-atp = { git = "ssh://git@github.com/iCog-Labs-Dev/Mathematics-ai-atp.git" }
